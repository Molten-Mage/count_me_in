<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6801997166">
<title>Count Me In</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #10231a;
    color: #eaf5ee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 420px; }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p { color: #b7cabd; line-height: 1.5; }
  code {
    background: #1c3428;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .store-link {
    display: inline-block;
    margin-top: 20px;
    background: #eaf5ee;
    color: #10231a;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="heading">You've been invited to Count Me In</h1>
    <p id="message">
      Open this link on a device with the Count Me In app installed to join
      automatically, or get the app below and enter the invite code once
      it's installed.
    </p>
    <a
      class="store-link"
      id="store-link"
      href="https://apps.apple.com/us/app/count-me-in-group-challenges/id6801997166"
    >Get the app</a>
  </div>
  <script>
    // Path looks like /join/group/ABC123 or /join/challenge/ABC123 —
    // this page only renders when the app isn't installed or the link
    // is opened somewhere Universal/App Links can't intercept it.
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts[0] === 'join' && parts.length === 3) {
      var kind = parts[1] === 'challenge' ? 'challenge' : 'group';
      var code = parts[2];
      document.getElementById('heading').textContent =
        "You've been invited to join a " + kind + " on Count Me In";
      document.getElementById('message').innerHTML =
        'Open this link on a device with the app installed to join ' +
        'automatically, or get the app below and enter invite code ' +
        '<code>' + code + '</code> once it\'s installed.';
    }

    // No auto-redirect to the App Store here on purpose: landing on this
    // page doesn't reliably mean the app isn't installed - Universal Links
    // can flash the app open then still fall back to Safari (an iOS-level
    // race, see TODO.md), and a forced redirect in that case fights the
    // Smart App Banner above (apple-itunes-app meta tag), which already
    // offers the correct native "Open" action when the app is present.
    // "Get the app" stays as the manual path for when it's genuinely not
    // installed.
  </script>
</body>
</html>
